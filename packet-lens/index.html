<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Packet Lens</title>
<meta name="description" content="Open a pcap or pcapng capture and analyze it in your browser: packet list, display filters, protocol tree, hex view, TCP streams and statistics.">
<link rel="icon" href="../packet-lens.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: bench-instrument analyzer. Filter bar on top, packet list, then layer tree beside the byte view. */
  --bg:#edf0f3; --surface:#ffffff; --ink:#17212c; --muted:#5a6877; --line:#d5dce4; --accent:#0a63b8; --accent-ink:#ffffff;
  --hl:#ffd970; --hl-ink:#1a1400; --soft:#f5f7f9;
  --ok:#1d7a4c; --warn:#9a6100; --crit:#b42318;
  --t-tcp:#efeafc; --t-udp:#e3effc; --t-dns:#dcf2ec; --t-http:#e4f5d8; --t-tls:#f4eaf8; --t-icmp:#fce8ec; --t-arp:#fbf2d2; --t-syn:#e6e9ed; --t-bad:#fadcd9; --t-bad-ink:#7c1810; --t-other:#ffffff;
  --font-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1217; --surface:#141a21; --ink:#dde5ed; --muted:#8a97a6; --line:#26303b; --accent:#4c9bff; --accent-ink:#04111f;
    --hl:#7a5f0e; --hl-ink:#fff6d6; --soft:#10161c;
    --ok:#5cc98f; --warn:#e3ae4f; --crit:#ff8a7a;
    --t-tcp:#1f1b30; --t-udp:#152433; --t-dns:#132c27; --t-http:#1a2b15; --t-tls:#291c2e; --t-icmp:#301a20; --t-arp:#2c2712; --t-syn:#1b2027; --t-bad:#3a1714; --t-bad-ink:#ffb3a8; --t-other:#141a21;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1217; --surface:#141a21; --ink:#dde5ed; --muted:#8a97a6; --line:#26303b; --accent:#4c9bff; --accent-ink:#04111f;
  --hl:#7a5f0e; --hl-ink:#fff6d6; --soft:#10161c;
  --ok:#5cc98f; --warn:#e3ae4f; --crit:#ff8a7a;
  --t-tcp:#1f1b30; --t-udp:#152433; --t-dns:#132c27; --t-http:#1a2b15; --t-tls:#291c2e; --t-icmp:#301a20; --t-arp:#2c2712; --t-syn:#1b2027; --t-bad:#3a1714; --t-bad-ink:#ffb3a8; --t-other:#141a21;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--font-ui);display:flex;flex-direction:column;overflow:hidden}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 12px;white-space:nowrap}
button:hover{border-color:var(--muted)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:5px 8px}
.mono{font-family:var(--font-mono)}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* top bar */
.top{display:flex;align-items:center;gap:16px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;letter-spacing:.01em}
.brand svg{color:var(--accent)}
.fileinfo{display:flex;align-items:baseline;gap:10px;min-width:0;flex:1}
.fileinfo #fileName{font-family:var(--font-mono);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{font-size:11px;padding:1px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.actions{display:flex;gap:8px;flex-wrap:wrap}

/* filter bar */
.filterbar{display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.fwrap{flex:1 1 380px;display:flex;align-items:center;border:1px solid var(--line);border-radius:6px;background:var(--soft);min-width:0}
.fwrap.ok{border-color:var(--ok)}
.fwrap.bad{border-color:var(--crit)}
.fwrap .tag{font-size:12px;color:var(--muted);padding:0 4px 0 10px;user-select:none}
#filter{flex:1;border:0;background:transparent;padding:7px 6px;font-family:var(--font-mono);font-size:13px;min-width:0;outline:none}
#fclear{border:0;background:transparent;padding:4px 10px;color:var(--muted);font-size:16px;line-height:1}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-family:var(--font-mono);font-size:12px;padding:3px 9px;border-radius:99px;background:var(--soft)}
#fmsg{font-size:12px;color:var(--muted);flex-basis:100%;min-height:0}
#fmsg.err{color:var(--crit)}
#fmsg:empty{display:none}

/* tabs */
.tabs{display:flex;align-items:center;gap:4px;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs .tab{border:0;border-bottom:2px solid transparent;border-radius:0;background:transparent;padding:9px 12px;color:var(--muted);font-weight:500}
.tabs .tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs .spacer{flex:1}
.tabs .tools{display:flex;gap:8px;align-items:center;padding:5px 0}
.tabs label{font-size:12px;color:var(--muted)}

main{flex:1;min-height:0;display:flex;flex-direction:column}
.view{flex:1;min-height:0}
.view[hidden],#packetsView[hidden]{display:none}

/* packets view */
#packetsView{display:grid;grid-template-rows:var(--split,1fr) 6px minmax(160px,1fr);padding:10px 16px 0;gap:0}
.pane{background:var(--surface);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.cols{--cols:64px 112px minmax(110px,1.1fr) minmax(110px,1.1fr) 76px 64px minmax(160px,3fr)}
.lhead,.row{display:grid;grid-template-columns:var(--cols);align-items:center;font-size:12.5px}
.lhead{font-weight:600;color:var(--muted);font-size:12px;border-bottom:1px solid var(--line);background:var(--soft);overflow:hidden;scrollbar-gutter:stable}
.lhead span{padding:6px 8px;white-space:nowrap}
#list{position:relative;overflow:auto;flex:1;min-height:0;scrollbar-gutter:stable;outline:none}
#list:focus-visible{box-shadow:inset 0 0 0 2px var(--accent)}
#rows{position:absolute;inset:0 0 auto 0}
.row{position:absolute;left:0;right:0;height:24px;font-family:var(--font-mono);font-size:12px;cursor:default;border-bottom:1px solid color-mix(in srgb,var(--line) 55%,transparent);font-variant-numeric:tabular-nums}
.row span{padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-no,.c-len{text-align:right}
.r-tcp{background:var(--t-tcp)}.r-udp{background:var(--t-udp)}.r-dns{background:var(--t-dns)}.r-http{background:var(--t-http)}.r-tls{background:var(--t-tls)}
.r-icmp{background:var(--t-icmp)}.r-arp{background:var(--t-arp)}.r-syn{background:var(--t-syn)}.r-bad{background:var(--t-bad);color:var(--t-bad-ink)}.r-other{background:var(--t-other)}
.row:hover{filter:brightness(.97)}
.row.sel{background:var(--accent);color:var(--accent-ink);filter:none}
.nomatch{padding:24px;color:var(--muted);font-family:var(--font-ui)}
.split{cursor:row-resize;display:flex;align-items:center;justify-content:center}
.split::before{content:"";width:44px;height:3px;border-radius:2px;background:var(--line)}
.split:hover::before{background:var(--muted)}
.lower{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:10px;min-height:0;padding-bottom:10px}
.panehead{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line);background:var(--soft);font-size:12px;font-weight:600;color:var(--muted);min-height:35px}
.panehead .grow{flex:1;min-width:0;font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.panehead button{padding:2px 10px;font-size:12px;font-weight:500}
#tree{overflow:auto;flex:1;font-family:var(--font-mono);font-size:12px;padding:4px 0}
.tl{display:flex;align-items:flex-start;gap:4px;padding:1px 8px 1px calc(var(--d)*16px + 6px);cursor:default;border-radius:3px}
.tl:hover{background:var(--soft)}
.tl.sel{background:var(--hl);color:var(--hl-ink)}
.car,.car-sp{flex:0 0 14px;height:18px;display:inline-flex;align-items:center;justify-content:center}
.car::before{content:"";border:4px solid transparent;border-left:5px solid var(--muted);margin-left:3px;transition:transform .12s}
.tn.open>.tl>.car::before{transform:rotate(90deg);margin-left:0;margin-top:3px}
.tn:not(.open)>.tk{display:none}
.tt{white-space:pre-wrap;word-break:break-word}
.tn[data-depth="0"]>.tl{font-weight:500}
#hexdump{overflow:auto;flex:1;font-family:var(--font-mono);font-size:12px;padding:6px 10px;line-height:1.6}
.hr{display:flex;gap:14px;white-space:pre}
.ho{color:var(--muted);user-select:none}
.hx .b{display:inline-block;width:2.4ch;text-align:left;cursor:pointer}
.hx .gap{display:inline-block;width:1ch}
.ha .a{cursor:pointer}
.b.hl,.a.hl{background:var(--hl);color:var(--hl-ink)}
.hnote{color:var(--muted);padding-top:6px;font-family:var(--font-ui)}
.empty{color:var(--muted);padding:16px;font-family:var(--font-ui)}

/* stats */
#statsView{overflow:auto;padding:14px 16px 24px}
.stats-note{color:var(--muted);font-size:13px;margin:0 0 12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.tile .k{font-size:12px;color:var(--muted)}
.tile .v{font-family:var(--font-mono);font-size:20px;font-weight:500;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;min-width:0}
.card.wide{grid-column:1/-1}
.card h3{margin:0 0 8px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;text-wrap:balance}
.card h3 .grow{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:3px 10px;font-size:12px;background:transparent}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.chartwrap{position:relative}
#chart{width:100%;height:220px;display:block}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--surface);font-size:12px;padding:4px 8px;border-radius:4px;font-family:var(--font-mono);white-space:nowrap;transform:translate(-50%,-110%)}
.hint{font-size:12px;color:var(--muted);margin:6px 0 0}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
.t th{text-align:left;font-weight:600;color:var(--muted);font-size:11.5px;padding:5px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:4px 8px;border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent);font-family:var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px}
.t td.num,.t th.num{text-align:right}
.t tr.click{cursor:pointer}
.t tr.click:hover td{background:var(--soft)}
.tscroll{overflow-x:auto}
.bar{height:6px;border-radius:3px;background:var(--accent);opacity:.8;min-width:2px}
.barcell{width:30%}
.exp{display:flex;flex-direction:column;gap:6px}
.exp button{display:flex;align-items:center;gap:10px;text-align:left;width:100%;padding:7px 10px}
.exp .lbl{flex:1}
.exp .cnt{font-family:var(--font-mono)}
.sev{font-size:11px;font-weight:600;padding:1px 8px;border-radius:99px;border:1px solid currentColor;min-width:64px;text-align:center}
.sev.crit{color:var(--crit)}.sev.warn{color:var(--warn)}.sev.note{color:var(--muted)}.sev.ok{color:var(--ok)}

/* status */
.status{display:flex;gap:18px;padding:5px 16px;font-size:12px;color:var(--muted);background:var(--surface);border-top:1px solid var(--line);flex-wrap:wrap;font-variant-numeric:tabular-nums}

/* overlays */
.drop{position:fixed;inset:0;background:color-mix(in srgb,var(--accent) 18%,transparent);display:flex;align-items:center;justify-content:center;z-index:50;pointer-events:none}
.drop[hidden]{display:none}
.drop div{background:var(--surface);border:2px dashed var(--accent);border-radius:12px;padding:28px 40px;font-size:16px;font-weight:500}
.modal{position:fixed;inset:0;background:rgba(5,10,15,.5);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}
.modal[hidden]{display:none}
.mbox{background:var(--surface);border:1px solid var(--line);border-radius:10px;width:min(880px,100%);max-height:calc(100% - 32px);display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.mhead{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.mhead h2{font-size:15px;margin:0;flex:1}
.mhead .x{border:0;font-size:18px;padding:2px 8px;background:transparent}
.mbody{padding:14px 16px;overflow:auto;flex:1}
.mfoot{display:flex;gap:8px;justify-content:flex-end;padding:10px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
pre.stream{font-family:var(--font-mono);font-size:12px;white-space:pre-wrap;word-break:break-all;margin:0;background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:10px;max-height:55vh;overflow:auto}
.d0{color:var(--accent)}
.d1{color:var(--crit)}
.legend{display:flex;gap:16px;font-size:12px;margin-bottom:8px;flex-wrap:wrap;align-items:center}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
textarea{width:100%;min-height:180px;font-family:var(--font-mono);font-size:12px;border:1px solid var(--line);border-radius:6px;background:var(--soft);padding:8px}
.help h4{margin:14px 0 6px;font-size:13px}
.help p{margin:0 0 8px;max-width:70ch}
.help code{font-family:var(--font-mono);font-size:12px;background:var(--soft);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.help .ex{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:4px 16px;font-size:13px}
.fields{columns:3 200px;font-family:var(--font-mono);font-size:12px;column-gap:16px}
.fields div{break-inside:avoid;padding:1px 0}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.swatches span{font-family:var(--font-mono);font-size:12px;padding:2px 8px;border-radius:4px;border:1px solid var(--line)}
.toast{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:8px;font-size:13px;z-index:70;max-width:min(560px,90vw)}
.toast[hidden]{display:none}
.busy{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--bg) 70%,transparent);z-index:55}
.busy[hidden]{display:none}
.busy div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px 22px;min-width:280px}
.prog{height:4px;background:var(--line);border-radius:2px;margin-top:10px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);width:0}

@media (max-width: 820px){
  .cols{--cols:52px minmax(90px,1fr) minmax(90px,1fr) 62px minmax(120px,2fr)}
  .c-time,.c-len{display:none}
  .lower{grid-template-columns:1fr;grid-template-rows:1fr 1fr}
  #packetsView{grid-template-rows:var(--split,42%) 6px minmax(260px,1fr)}
  .grid{grid-template-columns:1fr}
  .fileinfo{flex-basis:100%;order:3}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10" cy="10" r="6.5" stroke="currentColor" stroke-width="2"/><path d="M15 15l5.5 5.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M6.5 10h1.6l1-2.2 1.8 4.4 1-2.2h1.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Packet Lens
  </div>
  <div class="fileinfo"><span id="fileName">No capture</span><span id="fileTag" class="pill" hidden>Example data</span><span id="fileMeta" class="muted"></span></div>
  <div class="actions">
    <button id="openBtn" class="primary">Open capture…</button>
    <button id="pasteBtn">Paste hex</button>
    <button id="sampleBtn">Load sample</button>
    <input id="fileInput" type="file" accept=".pcap,.pcapng,.cap,.dmp,.gz,application/vnd.tcpdump.pcap" hidden>
  </div>
</header>

<div class="filterbar">
  <label for="filter" class="sr">Display filter</label>
  <div class="fwrap" id="fwrap"><span class="tag">Filter</span><input id="filter" spellcheck="false" autocomplete="off" placeholder="tcp.port == 443 && ip.addr == 10.0.0.0/8"><button id="fclear" aria-label="Clear filter" title="Clear filter">×</button></div>
  <button id="fapply" class="primary">Apply</button>
  <button id="fhelp">Filter syntax</button>
  <div class="chips" id="chips"></div>
  <div id="fmsg" role="status"></div>
</div>

<nav class="tabs" aria-label="Views">
  <button class="tab" data-tab="packets" aria-selected="true">Packets</button>
  <button class="tab" data-tab="stats" aria-selected="false">Statistics</button>
  <span class="spacer"></span>
  <div class="tools">
    <label for="timeFmt">Time</label>
    <select id="timeFmt">
      <option value="rel">Seconds since start</option>
      <option value="delta">Seconds since previous shown</option>
      <option value="abs">Time of day (UTC)</option>
    </select>
    <button id="copyCsv">Copy as CSV</button>
  </div>
</nav>

<main>
  <section id="packetsView" class="view">
    <div class="pane cols">
      <div class="lhead" role="row"><span class="c-no" style="text-align:right">No.</span><span class="c-time">Time</span><span>Source</span><span>Destination</span><span>Protocol</span><span class="c-len" style="text-align:right">Length</span><span>Info</span></div>
      <div id="list" tabindex="0" role="grid" aria-label="Packet list"><div id="spacer"></div><div id="rows"></div></div>
    </div>
    <div class="split" id="split" role="separator" aria-orientation="horizontal" aria-label="Resize packet list" tabindex="0"></div>
    <div class="lower">
      <div class="pane">
        <div class="panehead">Packet details <span class="grow" id="detailTitle"></span><button id="followBtn" disabled>Follow stream</button></div>
        <div id="tree"></div>
      </div>
      <div class="pane">
        <div class="panehead">Bytes <span class="grow" id="hexSel"></span></div>
        <div id="hexdump"></div>
      </div>
    </div>
  </section>
  <section id="statsView" class="view" hidden></section>
</main>

<footer class="status" id="status"></footer>

<div class="drop" id="drop" hidden><div>Drop a .pcap or .pcapng file to analyze it</div></div>
<div class="modal" id="modal" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>
<div class="busy" id="busy" hidden><div><div id="busyText">Decoding…</div><div class="prog"><i id="busyBar"></i></div></div></div>

<script id="core">
'use strict';
/* ================= byte helpers ================= */
class Malformed extends Error{}
const hex2=n=>n.toString(16).padStart(2,'0');
const hex4=n=>n.toString(16).padStart(4,'0');
const hex8=n=>(n>>>0).toString(16).padStart(8,'0');
function need(d,o,n){ if(o<0||o+n>d.length) throw new Malformed('truncated'); }
const U8=(d,o)=>{need(d,o,1);return d[o]};
const U16=(d,o)=>{need(d,o,2);return (d[o]<<8)|d[o+1]};
const U32=(d,o)=>{need(d,o,4);return ((d[o]<<24)|(d[o+1]<<16)|(d[o+2]<<8)|d[o+3])>>>0};
const mac=(d,o)=>{need(d,o,6);return Array.from(d.subarray(o,o+6),hex2).join(':')};

  const p=STATE.packets[STATE.sel]; if(!p) return; const isT=!!p.s.tcp; const key=isT?'tcp.stream':'udp.stream'; const id=p.s.f[key];
  const list=STATE.packets.filter(q=>q.s.f[key]===id&&(isT?q.s.tcp:q.s.udp)); const first=list[0]; const cli=first.s.src+'|'+first.s.sport;
  const chunks=[]; const tot=[0,0]; let shown=0;
  for(const q of list){ if(q.s.f['tcp.analysis.retransmission']) continue; const [po,pl]=q.s.pay||[0,0]; if(!pl) continue; const dir=(q.s.src+'|'+q.s.sport)===cli?0:1; tot[dir]+=pl;
    if(shown>2e6) continue; shown+=pl; const b=q.data.subarray(po,po+pl); const lc=chunks[chunks.length-1]; if(lc&&lc.dir===dir) lc.parts.push(b); else chunks.push({dir,parts:[b]}); }
  const A=`${first.s.src}:${first.s.sport}`, B=`${first.s.dst}:${first.s.dport}`;
  const render=mode=>chunks.map(c=>{ let t=''; for(const b of c.parts){ if(mode==='hex'){ for(let i=0;i<b.length;i+=16) t+=Array.from(b.subarray(i,i+16),hex2).join(' ')+'\n'; } else { for(let i=0;i<b.length;i++){ const x=b[i]; t+=(x>=32&&x<127)||x===10||x===9?String.fromCharCode(x):x===13?'':'.'; } } } return `<span class="d${c.dir}">${esc(t)}</span>`; }).join(mode==='hex'?'\n':'');
  const body=`<div class="legend"><span><i class="sw" style="background:var(--accent)"></i>${esc(A)} → ${esc(B)}: ${fmtBytes(tot[0])}</span><span><i class="sw" style="background:var(--crit)"></i>${esc(B)} → ${esc(A)}: ${fmtBytes(tot[1])}</span>
    <span style="flex:1"></span><span class="seg"><button data-m="ascii" aria-pressed="true">ASCII</button><button data-m="hex" aria-pressed="false">Hex</button></span></div>
    ${chunks.length?`<pre class="stream" id="streamPre">${render('ascii')}</pre>`:'<p class="empty">This stream carries no payload bytes, only control segments.</p>'}
    ${isT&&chunks.length?'<p class="hint">Retransmitted segments are left out. Encrypted payloads (TLS, QUIC) show as unreadable bytes.</p>':''}`;
  openModal(`Follow ${isT?'TCP':'UDP'} stream ${id}`,body,`<button class="primary" data-act="filter">Filter to this stream</button>`);
  els.modal.querySelector('.seg')?.addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; els.modal.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed',x===b)); const pre=$('#streamPre'); if(pre) pre.innerHTML=render(b.dataset.m); });
  els.modal.querySelector('[data-act="filter"]').addEventListener('click',()=>{ closeModal(); setFilter(`${key} == ${id}`); });
}
$('#followBtn').addEventListener('click',followStream);

/* ---------- stats ---------- */
const PROTO_FILTER={IPv4:'ip',IPv6:'ipv6',Ethernet:'eth',ICMPv6:'icmpv6','802.1Q VLAN':'vlan'};
function computeStats(){
  const P=STATE.packets, V=STATE.view; let bytes=0, tmin=Infinity, tmax=-Infinity;
  const proto=new Map(), ep=new Map(), conv=new Map(), dnsm=new Map(), hostm=new Map(); const ex={retrans:0,rst:0,zw:0,dnserr:0,unreach:0,malformed:0,trunc:0};
  const inc=(m,k,b)=>{ const e=m.get(k)||{pk:0,b:0}; e.pk++; e.b+=b; m.set(k,e); };
  for(const i of V){ const p=P[i], s=p.s, f=s.f; bytes+=p.len; if(p.ts<tmin) tmin=p.ts; if(p.ts>tmax) tmax=p.ts; inc(proto,s.proto,p.len);
    const iv=f['ip.src']?'ip':f['ipv6.src']?'ipv6':null;
    if(iv){ const a=f[iv+'.src'], b=f[iv+'.dst'];
      for(const [x,dir] of [[a,'tx'],[b,'rx']]){ const e=ep.get(x)||{addr:x,iv,pk:0,tx:0,rx:0}; e.pk++; e[dir]+=p.len; ep.set(x,e); }
      let pr=iv==='ip'?'IPv4':'IPv6', pa=null, pb=null; if(s.tcp){ pr='TCP'; pa=s.tcp.sp; pb=s.tcp.dp; } else if(s.udp){ pr='UDP'; pa=s.udp.sp; pb=s.udp.dp; }
      const A=a+'|'+pa, B=b+'|'+pb, fwd=A<=B, key=pr+'|'+(fwd?A+'|'+B:B+'|'+A);
      let c=conv.get(key); if(!c){ c={pr,iv,a:fwd?a:b,pa:fwd?pa:pb,b:fwd?b:a,pb:fwd?pb:pa,pk:0,ab:0,ba:0,t0:p.ts,t1:p.ts,stream:s.tcp?f['tcp.stream']:s.udp?f['udp.stream']:null}; conv.set(key,c); }
      c.pk++; if(fwd) c.ab+=p.len; else c.ba+=p.len; c.t1=p.ts; }
    if(f['dns.qry.name']){ const qn=f['dns.qry.name'], qt=f['dns.qry.type']; qn.forEach((n,k)=>{ const key=n+'|'+qt[k]; let e=dnsm.get(key); if(!e){ e={name:n,t:qt[k],q:0,r:0,ans:new Set(),err:''}; dnsm.set(key,e); }
      if(f['dns.flags.response']){ e.r++; for(const a of (f['dns.a']||[]).concat(f['dns.aaaa']||[],f['dns.cname']||[])) e.ans.add(a); if(f['dns.flags.rcode']) e.err=RCODE[f['dns.flags.rcode']]||'Error'; } else e.q++; });
      if(f['dns.flags.response']&&f['dns.flags.rcode']) ex.dnserr++; }

}
function renderStats(){
  STATE.statsDirty=false; const S=computeStats(); const root=els.stats;
  if(!S.n){ root.innerHTML=`<p class="empty">${STATE.packets.length?'No packets match the current filter, so there is nothing to summarize.':'Open a capture to see its statistics.'}</p>`; return; }
  const dur=Math.max(0,S.tmax-S.tmin);
  const scope=STATE.filter?`Figures cover the ${fmtNum(S.n)} packets matching <code class="mono">${esc(STATE.filter)}</code>, out of ${fmtNum(STATE.packets.length)}.`:`Figures cover all ${fmtNum(S.n)} packets in the capture. Apply a filter to narrow them. Click any row to filter to it.`;
  const tile=(k,v)=>`<div class="tile"><div class="k">${k}</div><div class="v">${v}</div></div>`;
  const protos=[...S.proto.entries()].sort((a,b)=>b[1].pk-a[1].pk); const pmax=protos[0][1].pk;
  const eps=[...S.ep.values()].sort((a,b)=>(b.tx+b.rx)-(a.tx+a.rx)).slice(0,12); const emax=eps.length?eps[0].tx+eps[0].rx:1;
  const convs=[...S.conv.values()].sort((a,b)=>(b.ab+b.ba)-(a.ab+a.ba)).slice(0,60);
  const dnsl=[...S.dnsm.values()].sort((a,b)=>(b.q+b.r)-(a.q+a.r)).slice(0,40);
  const hosts=[...S.hostm.entries()].sort((a,b)=>b[1].pk-a[1].pk).slice(0,30);
  const X=S.ex; const expert=[
    ['crit','TCP resets (RST)',X.rst,'tcp.flags.rst==1'],['warn','TCP retransmissions',X.retrans,'tcp.analysis.retransmission'],['warn','TCP zero window',X.zw,'tcp.analysis.zero_window'],
    ['warn','DNS error responses',X.dnserr,'dns.flags.rcode != 0'],['warn','ICMP destination unreachable',X.unreach,'icmp.type==3 || icmpv6.type==1'],['crit','Malformed packets',X.malformed,'malformed'],['note','Packets cut short by the capture snap length',X.trunc,null]];
  const qf=(f,v)=>`${f} == ${/^[\w.:\-\/]+$/.test(String(v))?v:'"'+String(v).replace(/"/g,'\\"')+'"'}`;
  root.innerHTML=`<p class="stats-note">${scope}</p>
  <div class="tiles">${tile('Packets',fmtNum(S.n))}${tile('Bytes on wire',fmtBytes(S.bytes))}${tile('Duration',fmtDur(dur))}${tile('Average rate',dur>0?(S.n/dur).toFixed(1)+' pkt/s':'n/a')}${tile('Average throughput',dur>0?fmtRate(S.bytes*8/dur):'n/a')}${tile('Avg packet size',fmtNum(Math.round(S.bytes/S.n))+' B')}</div>
  <div class="grid">
    <section class="card wide"><h3><span class="grow">Traffic over time</span><span class="seg" id="chartSeg"><button data-m="pk" aria-pressed="${STATE.chartMode==='pk'}">Packets</button><button data-m="b" aria-pressed="${STATE.chartMode==='b'}">Bytes</button></span></h3>
      <div class="chartwrap"><canvas id="chart" aria-label="Traffic over time chart"></canvas><div class="tip" id="tip" hidden></div></div><p class="hint" id="chartHint"></p></section>
    <section class="card"><h3>Protocols <span class="muted" style="font-weight:400">(highest decoded layer)</span></h3><div class="tscroll"><table class="t"><thead><tr><th>Protocol</th><th class="barcell"></th><th class="num">Packets</th><th class="num">%</th><th class="num">Bytes</th></tr></thead><tbody>
      ${protos.map(([k,v])=>`<tr class="click" data-f="${esc(PROTO_FILTER[k]||k.toLowerCase().split(' ')[0])}"><td>${esc(k)}</td><td class="barcell"><div class="bar" style="width:${(100*v.pk/pmax).toFixed(1)}%"></div></td><td class="num">${fmtNum(v.pk)}</td><td class="num">${(100*v.pk/S.n).toFixed(1)}</td><td class="num">${fmtBytes(v.b)}</td></tr>`).join('')}</tbody></table></div></section>
    <section class="card"><h3>Things to look at</h3><div class="exp">${expert.map(([sev,l,c,f])=>`<button ${c&&f?`data-f="${esc(f)}"`:'disabled'}><span class="sev ${c?sev:'ok'}">${c?{crit:'Error',warn:'Warning',note:'Note'}[sev]:'Clear'}</span><span class="lbl">${esc(l)}</span><span class="cnt">${fmtNum(c)}</span></button>`).join('')}</div></section>
    <section class="card"><h3>Top endpoints</h3><div class="tscroll"><table class="t"><thead><tr><th>Address</th><th class="barcell"></th><th class="num">Packets</th><th class="num">Sent</th><th class="num">Received</th></tr></thead><tbody>
      ${eps.map(e=>`<tr class="click" data-f="${esc(e.iv+'.addr == '+e.addr)}"><td title="${esc(e.addr)}">${esc(e.addr)}</td><td class="barcell"><div class="bar" style="width:${(100*(e.tx+e.rx)/emax).toFixed(1)}%"></div></td><td class="num">${fmtNum(e.pk)}</td><td class="num">${fmtBytes(e.tx)}</td><td class="num">${fmtBytes(e.rx)}</td></tr>`).join('')||'<tr><td colspan="5" class="muted">No IP traffic.</td></tr>'}</tbody></table></div></section>
    <section class="card"><h3>Hosts named in TLS and HTTP</h3><div class="tscroll"><table class="t"><thead><tr><th>Host</th><th>Seen in</th><th class="num">Packets</th></tr></thead><tbody>
      ${hosts.map(([k,v])=>{ const [h,src]=k.split('|'); return `<tr class="click" data-f="${esc(qf(src==='HTTP Host'?'http.host':'tls.sni',h))}"><td title="${esc(h)}">${esc(h)}</td><td class="muted" style="font-family:var(--font-ui)">${src}</td><td class="num">${v.pk}</td></tr>`; }).join('')||'<tr><td colspan="3" class="muted" style="font-family:var(--font-ui)">No TLS Client Hellos or HTTP requests.</td></tr>'}</tbody></table></div></section>
    <section class="card wide"><h3>DNS lookups</h3><div class="tscroll"><table class="t"><thead><tr><th>Name</th><th>Type</th><th class="num">Queries</th><th class="num">Responses</th><th>Answers</th><th>Status</th></tr></thead><tbody>
      ${dnsl.map(e=>`<tr class="click" data-f="${esc(qf('dns.qry.name',e.name))}"><td title="${esc(e.name)}">${esc(e.name)}</td><td>${esc(RRT[e.t]||e.t)}</td><td class="num">${e.q}</td><td class="num">${e.r}</td><td title="${esc([...e.ans].join(', '))}">${esc([...e.ans].join(', ')||(e.r?'(none)':''))}</td><td>${e.err?`<span class="sev warn">${esc(e.err)}</span>`:e.r?'<span class="sev ok">Answered</span>':'<span class="sev note">No reply</span>'}</td></tr>`).join('')||'<tr><td colspan="6" class="muted" style="font-family:var(--font-ui)">No DNS traffic.</td></tr>'}</tbody></table></div></section>
    <section class="card wide"><h3>Conversations <span class="muted" style="font-weight:400">(by bytes, top ${convs.length})</span></h3><div class="tscroll"><table class="t"><thead><tr><th>Protocol</th><th>Address A</th><th class="num">Port A</th><th>Address B</th><th class="num">Port B</th><th class="num">Packets</th><th class="num">A → B</th><th class="num">B → A</th><th class="num">Start</th><th class="num">Duration</th></tr></thead><tbody>
      ${convs.map(c=>{ const f=c.stream!=null?`${c.pr.toLowerCase()}.stream == ${c.stream}`:`${c.iv}.addr == ${c.a} && ${c.iv}.addr == ${c.b}`; return `<tr class="click" data-f="${esc(f)}"><td>${c.pr}</td><td title="${esc(c.a)}">${esc(c.a)}</td><td class="num">${c.pa??''}</td><td title="${esc(c.b)}">${esc(c.b)}</td><td class="num">${c.pb??''}</td><td class="num">${fmtNum(c.pk)}</td><td class="num">${fmtBytes(c.ab)}</td><td class="num">${fmtBytes(c.ba)}</td><td class="num">${(c.t0-T0).toFixed(3)}</td><td class="num">${(c.t1-c.t0).toFixed(3)} s</td></tr>`; }).join('')||'<tr><td colspan="10" class="muted">No IP conversations.</td></tr>'}</tbody></table></div></section>
  </div>`;
  root.querySelectorAll('[data-f]').forEach(el=>el.addEventListener('click',()=>setFilter(el.dataset.f)));
  $('#chartSeg').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; STATE.chartMode=b.dataset.m; $('#chartSeg').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b)); drawChart(); });
  buildChart(S); drawChart(); bindChart();
}
function niceStep(x){ const e=Math.pow(10,Math.floor(Math.log10(x))); const f=x/e; return (f<=1?1:f<=2?2:f<=5?5:10)*e; }
function buildChart(S){
  const dur=Math.max(0,S.tmax-S.tmin); const steps=[0.001,0.002,0.005,0.01,0.02,0.05,0.1,0.2,0.5,1,2,5,10,15,30,60,120,300,600,900,1800,3600,7200,21600,43200,86400];
  let size=steps.find(s=>dur/s<=72)||86400; if(dur===0) size=1; const n=Math.max(1,Math.ceil((dur+1e-9)/size));

  for(const i of STATE.view){ const p=P[i]; let k=Math.floor((p.ts-S.tmin)/size); if(k>=n) k=n-1; pk[k]++; b[k]+=p.len; }
  CHART={pk,b,size,start:S.tmin-T0,n,hover:-1};
  $('#chartHint').textContent=`Each bar is ${size<1?(size*1000)+' ms':size<60?size+' s':size<3600?(size/60)+' min':(size/3600)+' h'}. Time is in seconds since the first packet. Click a bar to filter to that interval.`;
}
function drawChart(){
  const cv=$('#chart'); if(!cv||!CHART) return; const dpr=window.devicePixelRatio||1; const W=cv.clientWidth, H=220; if(!W) return;
  cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr); const g=cv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,W,H);
  const css=getComputedStyle(document.documentElement), col=k=>css.getPropertyValue(k).trim();
  const vals=STATE.chartMode==='b'?CHART.b:CHART.pk; const max=Math.max(1,...vals);
  let step=niceStep(max/4); if(STATE.chartMode==='pk') step=Math.max(1,step); const top=step*Math.ceil(max/step);
  const fmtY=v=>STATE.chartMode==='b'?fmtBytes(v):fmtNum(v);
  g.font='11px "IBM Plex Mono", ui-monospace, monospace'; const lw=Math.max(...Array.from({length:Math.round(top/step)+1},(_,k)=>g.measureText(fmtY(k*step)).width));
  const L=Math.ceil(lw)+12, R=8, Tp=10, B=24, pw=W-L-R, ph=H-Tp-B; CHART.geo={L,pw,Tp,ph,top};
  g.textAlign='right'; g.textBaseline='middle';
  for(let v=0;v<=top+1e-9;v+=step){ const y=Tp+ph*(1-v/top); g.strokeStyle=col('--line'); g.lineWidth=1; g.beginPath(); g.moveTo(L,Math.round(y)+.5); g.lineTo(W-R,Math.round(y)+.5); g.stroke(); g.fillStyle=col('--muted'); g.fillText(fmtY(v),L-6,y); }
  const bw=pw/CHART.n, gap=bw>6?Math.min(2,bw*.15):0;
  for(let i=0;i<CHART.n;i++){ const v=vals[i]; if(!v) continue; const h=Math.max(1,ph*v/top); g.fillStyle=col('--accent'); g.globalAlpha=CHART.hover===i?1:.78; g.fillRect(L+i*bw+gap/2,Tp+ph-h,Math.max(1,bw-gap),h); }
  g.globalAlpha=1; g.fillStyle=col('--muted'); g.textAlign='center'; g.textBaseline='top';
  const every=Math.max(1,Math.ceil(CHART.n/Math.max(2,Math.floor(pw/80)))); const dec=CHART.size<0.01?3:CHART.size<1?2:0;
  for(let i=0;i<=CHART.n;i+=every){ const x=L+i*bw; g.fillText((CHART.start+i*CHART.size).toFixed(dec)+'s',Math.min(Math.max(x,L+12),W-R-14),Tp+ph+6); }
  g.strokeStyle=col('--muted'); g.beginPath(); g.moveTo(L,Tp+ph+.5); g.lineTo(W-R,Tp+ph+.5); g.stroke();
}
function bindChart(){
  const cv=$('#chart'), tip=$('#tip'); const at=e=>{ const r=cv.getBoundingClientRect(); const x=e.clientX-r.left; const {L,pw}=CHART.geo; if(x<L||x>L+pw) return -1; return Math.min(CHART.n-1,Math.floor((x-L)/(pw/CHART.n))); };
  cv.addEventListener('mousemove',e=>{ const i=at(e); if(i!==CHART.hover){ CHART.hover=i; drawChart(); } if(i<0){ tip.hidden=true; return; } const a=CHART.start+i*CHART.size; const {L,pw}=CHART.geo;
    tip.hidden=false; tip.textContent=`${a.toFixed(3)}–${(a+CHART.size).toFixed(3)} s · ${fmtNum(CHART.pk[i])} pkts · ${fmtBytes(CHART.b[i])}`; tip.style.left=Math.min(Math.max(L+(i+.5)*pw/CHART.n,120),cv.clientWidth-120)+'px'; tip.style.top=(CHART.geo.Tp+8)+'px'; });
  cv.addEventListener('mouseleave',()=>{ tip.hidden=true; CHART.hover=-1; drawChart(); });
  cv.addEventListener('click',e=>{ const i=at(e); if(i<0||!(CHART.pk[i])) return; const a=CHART.start+i*CHART.size, b=a+CHART.size; const base=STATE.filter?`(${STATE.filter}) && `:''; setFilter(`${base}frame.time_relative >= ${a.toFixed(6)} && frame.time_relative < ${b.toFixed(6)}`); });
}
window.addEventListener('resize',()=>{ if(STATE.tab==='stats') drawChart(); });
new MutationObserver(()=>{ if(STATE.tab==='stats') drawChart(); }).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
window.matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{ if(STATE.tab==='stats') drawChart(); });

/* ---------- status, tabs, misc ---------- */
function updateStatus(){ const P=STATE.packets, V=STATE.view; const bytes=P.reduce((a,p)=>a+p.len,0);
  els.status.innerHTML=`<span>Packets: ${fmtNum(P.length)}</span><span>Displayed: ${fmtNum(V.length)}${P.length?' ('+(100*V.length/P.length).toFixed(1)+'%)':''}</span><span>Size: ${fmtBytes(bytes)}</span><span>Decoded in ${STATE.loadMs.toFixed(0)} ms</span><span style="flex:1"></span><span>Files are decoded in your browser. Nothing is uploaded.</span>`; }
function switchTab(t){ STATE.tab=t; document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===t)); $('#packetsView').hidden=t!=='packets'; els.stats.hidden=t!=='stats';
  if(t==='stats'){ if(STATE.statsDirty) renderStats(); else drawChart(); } else renderList(); }
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>switchTab(b.dataset.tab)));
$('#timeFmt').addEventListener('change',e=>{ STATE.timeMode=e.target.value; renderList(); });
$('#openBtn').addEventListener('click',()=>$('#fileInput').click());
$('#fileInput').addEventListener('change',e=>{ const f=e.target.files[0]; if(f) openFile(f); e.target.value=''; });
$('#sampleBtn').addEventListener('click',()=>{ els.filter.value=''; loadSample(); });
$('#pasteBtn').addEventListener('click',showPaste);
$('#fhelp').addEventListener('click',showHelp);
$('#fapply').addEventListener('click',()=>applyFilter(els.filter.value));
$('#fclear').addEventListener('click',()=>{ els.filter.value=''; applyFilter(''); els.filter.focus(); });
els.filter.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); applyFilter(els.filter.value); } });
let vt=0; els.filter.addEventListener('input',()=>{ clearTimeout(vt); vt=setTimeout(validateFilter,180); });
$('#chips').addEventListener('click',e=>{ const b=e.target.closest('[data-f]'); if(b) setFilter(b.dataset.f); });
$('#copyCsv').addEventListener('click',async()=>{
  const q=v=>'"'+String(v).replace(/"/g,'""')+'"'; const P=STATE.packets; const lines=['"No.","Time","Source","Destination","Protocol","Length","Info"'];
  STATE.view.slice(0,200000).forEach((i,k)=>{ const p=P[i]; lines.push([p.no,fmtTime(p,k),p.s.src,p.s.dst,p.s.proto,p.len,p.s.info].map(q).join(',')); });
  const txt=lines.join('\n');
  try{ await navigator.clipboard.writeText(txt); toast(`Copied ${fmtNum(STATE.view.length)} rows as CSV.`); }
  catch(_){ openModal('Copy as CSV',`<p style="margin-top:0">Your browser blocked clipboard access. Select the text below and copy it.</p><textarea readonly id="csvOut">${esc(txt)}</textarea>`); const ta=$('#csvOut'); ta.focus(); ta.select(); }
});
/* splitter */
(()=>{ const sp=$('#split'), pv=$('#packetsView'); let y0=0,h0=0,drag=false; const listPane=pv.firstElementChild;
  sp.addEventListener('pointerdown',e=>{ drag=true; y0=e.clientY; h0=listPane.getBoundingClientRect().height; sp.setPointerCapture(e.pointerId); });
  sp.addEventListener('pointermove',e=>{ if(!drag) return; const total=pv.clientHeight; const h=Math.max(120,Math.min(total-200,h0+e.clientY-y0)); pv.style.setProperty('--split',h+'px'); });
  sp.addEventListener('pointerup',()=>{ drag=false; });
  sp.addEventListener('keydown',e=>{ if(e.key!=='ArrowUp'&&e.key!=='ArrowDown') return; e.preventDefault(); const h=listPane.getBoundingClientRect().height+(e.key==='ArrowUp'?-30:30); pv.style.setProperty('--split',Math.max(120,Math.min(pv.clientHeight-200,h))+'px'); });
})();
/* drag and drop */
(()=>{ const drop=$('#drop'); let depth=0; const hasFiles=e=>e.dataTransfer&&[...e.dataTransfer.types].includes('Files');
  document.addEventListener('dragenter',e=>{ if(!hasFiles(e)) return; e.preventDefault(); depth++; drop.hidden=false; });
  document.addEventListener('dragover',e=>{ if(hasFiles(e)) e.preventDefault(); });
  document.addEventListener('dragleave',()=>{ depth=Math.max(0,depth-1); if(!depth) drop.hidden=true; });
  document.addEventListener('drop',e=>{ if(!hasFiles(e)) return; e.preventDefault(); depth=0; drop.hidden=true; const f=e.dataTransfer.files[0]; if(f) openFile(f); });
})();

loadSample();
</script>
</body>
</html>
